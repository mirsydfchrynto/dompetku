name: dompetku
description: "Aplikasi kasir digital - penangkap notifikasi pembayaran QRIS"
publish_to: 'none'
version: 1.4.2+142

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── DATABASE LOKAL ──────────────────────────────────
  # Hive: database NoSQL cepat untuk Flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ── NOTIFICATION LISTENER ───────────────────────────
  flutter_notification_listener: ^1.4.0

  # ── FORMAT TAMPILAN ─────────────────────────────────
  intl: ^0.19.0
  google_fonts: ^6.2.1

  # ── EXPORT CSV ──────────────────────────────────────
  csv: ^6.0.0
  path_provider: ^2.1.5
  share_plus: ^10.0.3

  # ── NETWORKING & WEBHOOK ────────────────────────────
  http: ^1.2.2

  # ── UTILITY ─────────────────────────────────────────
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  flutter_secure_storage: ^10.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logos/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logos/icon.jpg"
  min_sdk_android: 21
